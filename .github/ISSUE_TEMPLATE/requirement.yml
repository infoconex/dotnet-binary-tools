name: Individual requirement
description: Track an independently testable feature, quality requirement or engineering change.
title: "FR-###: "
body:
  - type: input
    id: requirement
    attributes:
      label: Stable requirement or engineering identifier
      placeholder: FR-001
      description: Use an existing ID from docs/requirements or explain the engineering change.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must - v0.1
        - Should - later
        - Future - deferred
    validations:
      required: true
  - type: textarea
    id: observable-behavior
    attributes:
      label: Observable behavior or quality obligation
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Given/When/Then acceptance scenarios
      description: Link the authoritative docs/scenarios file and describe any proposed additions.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Identify NUnit test levels and synthetic fixtures; planned tests are not evidence.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Dependencies, security, cross-platform/AOT risks and exclusions
