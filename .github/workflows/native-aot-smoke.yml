name: .NET 11 Native AOT smoke test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine relevant changes
    runs-on: ubuntu-latest
    outputs:
      aot: ${{ steps.classify.outputs.aot }}
    steps:
      - name: Checkout full history for changes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_change_scope.py
  aot:
    needs: scope
    name: Native AOT CLI (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - name: Note intentionally omitted Native AOT validation
        if: needs.scope.outputs.aot != 'true'
        run: echo "No Native AOT inputs changed; validation was not executed."
      - name: Checkout
        if: needs.scope.outputs.aot == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install .NET 11 SDK
        if: needs.scope.outputs.aot == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.x'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props
            Directory.Build.targets
            global.json
            nuget.config
            src/**/*.csproj
            tests/**/*.csproj
            .github/workflows/native-aot-smoke.yml
      - name: Verify Linux AOT compiler prerequisites
        if: needs.scope.outputs.aot == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null 2>&1; then
            for candidate in clang-20 clang-19 clang-18 clang-17 clang-16; do
              if command -v "$candidate" >/dev/null 2>&1; then
                sudo ln -s "$(command -v "$candidate")" /usr/local/bin/clang
                break
              fi
            done
          fi
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y clang zlib1g-dev; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Linux AOT prerequisites unavailable after three installation attempts." >&2
                exit 1
              fi
              sleep 10
            done
          fi
          command -v clang
          clang --version
          test -f /usr/include/zlib.h
      - name: Validate Native AOT publication and CLI smoke behavior
        if: needs.scope.outputs.aot == 'true'
        shell: pwsh
        run: ./scripts/validate-aot.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Verify Native AOT tool packages and isolated installation
        if: needs.scope.outputs.aot == 'true'
        shell: pwsh
        run: ./scripts/validate-tool-package.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Provision SDK-free Linux consumer image
        if: needs.scope.outputs.aot == 'true' && runner.os == 'Linux'
        run: docker pull ubuntu:24.04
      - name: Validate Linux runtime-independent consumer
        if: needs.scope.outputs.aot == 'true' && runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/validate-linux-runtime-free.ps1
      - name: Evaluate isolated NuGet lock files and RID-specific AOT restore
        if: needs.scope.outputs.aot == 'true' && runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/evaluate-package-locks.ps1
      - name: Record SHA-256 artifact checksums
        if: needs.scope.outputs.aot == 'true'
        shell: pwsh
        run: |
          ./scripts/write-artifact-checksums.ps1 -ArtifactDirectory 'artifacts/aot/${{ matrix.rid }}'
          ./scripts/write-artifact-checksums.ps1 -ArtifactDirectory 'artifacts/tool-packages'
      - name: Retain unpromoted AOT binaries and tool packages
        if: needs.scope.outputs.aot == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pre-release-${{ matrix.rid }}
          path: |
            artifacts/aot/${{ matrix.rid }}/
            artifacts/tool-packages/*.nupkg
            artifacts/tool-packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
