name: .NET 11 build, test and style
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine relevant changes
    runs-on: ubuntu-latest
    outputs:
      managed: ${{ steps.classify.outputs.managed }}
    steps:
      - name: Checkout full history for changes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_change_scope.py
  build-test:
    needs: scope
    name: Managed build and NUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Note intentionally omitted managed validation
        if: needs.scope.outputs.managed != 'true'
        run: echo "No managed inputs changed; validation was not executed."
      - name: Checkout
        if: needs.scope.outputs.managed == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install .NET 11 SDK
        if: needs.scope.outputs.managed == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.x'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props
            Directory.Build.targets
            global.json
            nuget.config
            src/**/*.csproj
            tests/**/*.csproj
      - name: Validate managed solution and NUnit
        if: needs.scope.outputs.managed == 'true'
        shell: pwsh
        run: ./scripts/validate-managed.ps1 -VerifyStyle:$IsLinux
      - name: Collect cross-platform NUnit coverage
        if: needs.scope.outputs.managed == 'true'
        shell: pwsh
        run: ./scripts/collect-coverage.ps1

      - name: Provision Python for repository coverage reporting
        if: needs.scope.outputs.managed == 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Render complete coverage report
        if: needs.scope.outputs.managed == 'true'
        run: >-
          python scripts/coverage_report.py
          --input artifacts/coverage/raw
          --output artifacts/coverage/report
          --artifact-name coverage-${{ matrix.os }}

      - name: Publish complete coverage results
        id: coverage_upload
        if: always() && needs.scope.outputs.managed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Present coverage summary and full report link
        if: needs.scope.outputs.managed == 'true'
        shell: pwsh
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage_upload.outputs['artifact-url'] }}
        run: |
          Get-Content 'artifacts/coverage/report/summary.md' | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY "[Download complete HTML report]($env:COVERAGE_ARTIFACT_URL) — open report/index.html from the ZIP."
