name: Issue 4 consumer operator script syntax

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/consumer-acceptance/**'
      - '.github/workflows/consumer-acceptance-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/consumer-acceptance/**'
      - '.github/workflows/consumer-acceptance-scripts.yml'

permissions:
  contents: read

jobs:
  windows-powershell-syntax:
    name: Parse Windows PowerShell 5.1 consumer script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Parse script using inbox Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/consumer-acceptance/win-x64.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            throw 'Windows PowerShell script syntax failed.'
          }
          Write-Host 'Syntax passed. SDK-equipped runner: consumer execution NOT tested.'

  intel-macos-bash-syntax:
    name: Parse Intel macOS consumer Bash script
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Parse script using system Bash
        shell: bash
        run: |
          bash -n scripts/consumer-acceptance/osx-x64.sh
          bash -n scripts/consumer-acceptance/osx-apple-silicon.sh
          bash -n scripts/consumer-acceptance/run-osx-apple-silicon-physical.sh
          bash -n scripts/consumer-acceptance/provision-osx-apple-silicon-vm.sh
          bash -n scripts/consumer-acceptance/run-osx-apple-silicon-guest.sh
          echo 'All macOS syntax checks passed. SDK-equipped runner: consumer execution NOT tested.'
